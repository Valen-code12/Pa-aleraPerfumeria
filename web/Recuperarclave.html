<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La placita - Recuperar contraseña</title>
  <link rel="icon" type="image/jpeg" href="imagenes/panaleraIcono.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  .logo-esquina {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 90px;
    height: auto;
    border-radius: 8px;
  }
  @media (max-width: 576px) {
    .logo-esquina { width: 60px; }
  }
  </style>
</head>
<body class="bg-light">
  <a href="InicioDeSesion.html">
    <img src="imagenes/panaleraIcono.jpg" alt="La Placita - Pañalera" class="logo-esquina">
  </a>
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
      <div class="card-body p-4">
        <h4 class="text-center mb-1">Pañalera y Perfumería</h4>
        <p class="text-center text-muted mb-4">Recuperar contraseña</p>

        <div id="aviso" class="alert d-none" role="alert"></div>

        <!-- Paso 1: mail -->
        <form id="formEmail">
          <p class="text-muted">Ingresá el mail de tu cuenta y te enviamos un código para elegir una contraseña nueva.</p>
          <div class="mb-3">
            <label for="email" class="form-label">Mail</label>
            <input type="email" class="form-control" id="email"
                   placeholder="nombre@ejemplo.com" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary w-100">Enviar código</button>
        </form>

        <!-- Paso 2: código y contraseña nueva -->
        <form id="formNueva" class="d-none">
          <p class="text-muted">
            Si <strong id="mailDestino"></strong> está registrado, te enviamos un código de 6 dígitos.
          </p>
          <div class="mb-3">
            <label for="codigo" class="form-label">Código de verificación</label>
            <input type="text" class="form-control text-center fs-4" id="codigo"
                   inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                   autocomplete="one-time-code" required>
          </div>
          <div class="mb-3">
            <label for="clave" class="form-label">Contraseña nueva</label>
            <input type="password" class="form-control" id="clave" minlength="6"
                   autocomplete="new-password" required>
            <div class="form-text">Mínimo 6 caracteres</div>
          </div>
          <div class="mb-3">
            <label for="clave2" class="form-label">Repetir contraseña nueva</label>
            <input type="password" class="form-control" id="clave2"
                   autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2">Cambiar contraseña</button>
          <div class="d-flex justify-content-between">
            <button type="button" id="btnReenviar" class="btn btn-link p-0" disabled>Reenviar código</button>
            <button type="button" id="btnVolver" class="btn btn-link p-0">Cambiar mail</button>
          </div>
        </form>

        <p class="text-center mt-3 mb-0">
          <a href="InicioDeSesion.html">Volver al inicio de sesión</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const formEmail = document.getElementById("formEmail");
    const formNueva = document.getElementById("formNueva");
    const aviso = document.getElementById("aviso");
    const btnReenviar = document.getElementById("btnReenviar");
    let emailActual = "";
    let temporizador = null;

    function mostrar(texto, tipo) {
      aviso.textContent = texto;
      aviso.className = "alert alert-" + tipo;
    }

    async function post(url, datos) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(datos).toString()
      });
      return { ok: res.ok, texto: await res.text() };
    }

    // Bloquea "Reenviar código" durante 60 segundos
    function iniciarEspera() {
      let segundos = 60;
      clearInterval(temporizador);
      btnReenviar.disabled = true;
      btnReenviar.textContent = "Reenviar código (" + segundos + ")";
      temporizador = setInterval(() => {
        segundos--;
        if (segundos <= 0) {
          clearInterval(temporizador);
          btnReenviar.disabled = false;
          btnReenviar.textContent = "Reenviar código";
        } else {
          btnReenviar.textContent = "Reenviar código (" + segundos + ")";
        }
      }, 1000);
    }

    // Paso 1 -> pide el código (el servidor responde igual exista o no el mail)
    async function pedirCodigo() {
      try {
        const r = await post("/recuperar", { email: emailActual });
        if (!r.ok) {
          mostrar(r.texto, "danger");
          return false;
        }
        return true;
      } catch (err) {
        mostrar("No se pudo conectar con el servidor.", "danger");
        return false;
      }
    }

    formEmail.addEventListener("submit", async (e) => {
      e.preventDefault();
      emailActual = document.getElementById("email").value.trim();

      if (await pedirCodigo()) {
        document.getElementById("mailDestino").textContent = emailActual;
        formEmail.classList.add("d-none");
        formNueva.classList.remove("d-none");
        document.getElementById("codigo").focus();
        mostrar("Revisá tu mail (también la carpeta de spam).", "info");
        iniciarEspera();
      }
    });

    btnReenviar.addEventListener("click", async () => {
      if (await pedirCodigo()) {
        mostrar("Si el mail está registrado, te enviamos un código nuevo.", "info");
        iniciarEspera();
      }
    });

    document.getElementById("btnVolver").addEventListener("click", () => {
      clearInterval(temporizador);
      aviso.className = "alert d-none";
      formNueva.reset();
      formNueva.classList.add("d-none");
      formEmail.classList.remove("d-none");
    });

    // Paso 2 -> código + contraseña nueva
    formNueva.addEventListener("submit", async (e) => {
      e.preventDefault();

      const clave = document.getElementById("clave").value;
      if (clave !== document.getElementById("clave2").value) {
        mostrar("Las contraseñas no coinciden.", "danger");
        return;
      }

      try {
        const r = await post("/recuperar/confirmar", {
          email: emailActual,
          codigo: document.getElementById("codigo").value.trim(),
          clave: clave
        });

        if (r.ok) {
          clearInterval(temporizador);
          mostrar(r.texto + " Redirigiendo al inicio de sesión...", "success");
          setTimeout(() => { window.location.href = "InicioDeSesion.html"; }, 2000);
        } else {
          mostrar(r.texto, "danger");
        }
      } catch (err) {
        mostrar("No se pudo conectar con el servidor.", "danger");
      }
    });
  </script>
<script>
  // Íconos de ojo (contorno con pestañas)
  const OJO_ABIERTO = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 13C6 7.5 18 7.5 22 13C18 18.5 6 18.5 2 13Z"/>
      <circle cx="12" cy="13" r="3.4"/><circle cx="12" cy="13" r="1.2" fill="currentColor"/>
      <path d="M12 3V7M6 5.5L7 8.2M18 5.5L17 8.2M2.5 8L4 10.5M21.5 8L20 10.5"/></svg>`;
  const OJO_CERRADO = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 11C6 16.5 18 16.5 22 11"/>
      <path d="M12 15.2V19M6.5 14.2L5.5 17.5M17.5 14.2L18.5 17.5M3.4 12.6L2 15.3M20.6 12.6L22 15.3"/></svg>`;

  // Agrega un botón "ojo" a cada campo de contraseña
  document.querySelectorAll('input[type="password"]').forEach((campo) => {
    const grupo = document.createElement("div");
    grupo.className = "input-group";
    campo.parentNode.insertBefore(grupo, campo);
    grupo.appendChild(campo);

    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "btn btn-outline-secondary d-flex align-items-center";
    boton.innerHTML = OJO_ABIERTO;
    boton.setAttribute("aria-label", "Mostrar contraseña");
    grupo.appendChild(boton);

    boton.addEventListener("click", () => {
      const oculto = campo.type === "password";
      campo.type = oculto ? "text" : "password";
      boton.innerHTML = oculto ? OJO_CERRADO : OJO_ABIERTO;
      boton.setAttribute("aria-label", oculto ? "Ocultar contraseña" : "Mostrar contraseña");
    });
  });
</script>
</body>
</html>
