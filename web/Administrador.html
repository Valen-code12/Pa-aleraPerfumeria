<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La placita - Administrador</title>
  <link rel="icon" type="image/jpeg" href="imagenes/panaleraIcono.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --turquesa: #1fb5a8; --turquesa-oscuro: #148c82; --verde: #9be23f; }
    body { background: #f4f9f8; }
    .barra { background: var(--turquesa); border-bottom: 4px solid var(--verde); }
    .barra .logo { height: 56px; width: 56px; border-radius: 8px; }
    .btn-usuario { background: none; border: 0; padding: 0; color: #fff; line-height: 1; }
    .btn-usuario:hover, .btn-usuario:focus { color: var(--verde); }
    .dropdown-item.active { background: var(--turquesa); }
    .btn-principal { background: var(--turquesa); border-color: var(--turquesa); color: #fff; }
    .btn-principal:hover { background: var(--turquesa-oscuro); border-color: var(--turquesa-oscuro); color: #fff; }
    .tarjeta-dato { border: 0; border-top: 5px solid var(--turquesa); }
    .tarjeta-dato.alerta { border-top-color: #f0ad4e; }
    .tarjeta-dato.peligro { border-top-color: #dc3545; }
    .tarjeta-dato .numero { font-size: 2.5rem; font-weight: 700; line-height: 1; }
    .foto-local { min-height: 260px; border: 2px dashed var(--turquesa); border-radius: 12px; background: #fff; }
    thead th { background: #dff5f2 !important; }
    .carrusel-local { border: 2px solid var(--turquesa); border-radius: 12px; background: #fff; overflow: hidden; }
    .carrusel-local img { height: 460px; object-fit: contain; }
    .carrusel-local .carousel-control-prev-icon, .carrusel-local .carousel-control-next-icon { filter: invert(1) grayscale(1); }
    .carrusel-local .carousel-indicators [data-bs-target] { background-color: var(--turquesa-oscuro); }
    @media (max-width: 576px) { .carrusel-local img { height: 340px; } }
  </style>
</head>
<body>
  <!-- Barra superior: logo, menú y usuario -->
  <header class="barra py-2">
    <div class="container d-flex align-items-center">
      <a href="Administrador.html"><img src="imagenes/panaleraIcono.jpg" alt="La Placita - Pañalera" class="logo"></a>

      <div class="dropdown ms-auto">
        <button class="btn-usuario" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Usuario">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="10" r="3.2"/>
            <path d="M5.8 18.5C7.2 16 9.4 15 12 15s4.8 1 6.2 3.5"/>
          </svg>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><span class="dropdown-item-text fw-semibold" id="nombreUsuario">Administrador</span></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item" id="btnSalir">Cerrar sesión</button></li>
        </ul>
      </div>
    </div>
  </header>
 
  <main class="container py-4">

    <div class="dropdown mb-3">
      <button class="btn btn-principal dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Menú</button>
      <ul class="dropdown-menu" id="menu">
        <li><button class="dropdown-item active" data-seccion="inicio">Inicio</button></li>
        <li><button class="dropdown-item" data-seccion="productos">Productos</button></li>
        <li><button class="dropdown-item" data-seccion="proveedores">Proveedores</button></li>
      </ul>
    </div>
 
    <!-- INICIO: panel de control -->
    <section id="inicio">
      <div id="carruselLocal" class="carousel slide carrusel-local mb-4" data-bs-ride="carousel" data-bs-interval="4000">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carruselLocal" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Foto 1"></button>
          <button type="button" data-bs-target="#carruselLocal" data-bs-slide-to="1" aria-label="Foto 2"></button>
          <button type="button" data-bs-target="#carruselLocal" data-bs-slide-to="2" aria-label="Foto 3"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active"><img src="imagenes/localfoto1.jpg" class="d-block w-100" alt="Frente de la Pañalera La Placita"></div>
          <div class="carousel-item"><img src="imagenes/localfoto2.jpg" class="d-block w-100" alt="Cartel y productos del local"></div>
          <div class="carousel-item"><img src="imagenes/localfoto3.jpg" class="d-block w-100" alt="Pañales en el local"></div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carruselLocal" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carruselLocal" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Siguiente</span>
        </button>
      </div>
      <div class="row text-center">
        <div class="col-md-4 mb-2"><strong>Redes</strong><br><span class="text-muted">Instagram / Facebook</span></div>
        <div class="col-md-4 mb-2"><strong>Contacto</strong><br><span class="text-muted">Teléfono / Celular</span></div>
        <div class="col-md-4 mb-2"><strong>Ubicación</strong><br><span class="text-muted">Dirección del local</span></div>
      </div>
    </section>
 
    <!-- PRODUCTOS -->
    <section id="productos" class="d-none">
      <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <button class="btn btn-principal" id="btnNuevoProducto">+ Nuevo producto</button>
        <input type="search" class="form-control w-auto" id="filtro" placeholder="Filtrar por nombre, código o categoría">
      </div>
      <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table align-middle mb-0">
          <thead><tr><th>Producto</th><th>Código</th><th>Categoría</th><th>Stock</th><th>Precio</th><th>Documento PDF/Excel</th><th>Edición</th></tr></thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>

      <!-- Selector oculto: lo abre el botón "+" de cada producto (solo PDF o Excel) -->
      <input type="file" id="archivoDoc" class="d-none"
             accept=".pdf,.xlsx,.xls,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
    </section>
 
    <!-- PROVEEDORES -->
    <section id="proveedores" class="d-none">
      <div class="mb-3"><button class="btn btn-principal" id="btnNuevoProveedor">+ Nuevo proveedor</button></div>
      <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table align-middle mb-0">
          <thead><tr><th>Nombre</th><th>Contacto</th><th>Teléfono</th><th>Dirección</th><th>Edición</th></tr></thead>
          <tbody id="tablaProveedores"></tbody>
        </table>
      </div>
    </section>
  </main>
 
  <!-- Ventana: producto -->
  <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><form class="modal-content" id="formProducto">
      <div class="modal-header"><h5 class="modal-title" id="tituloProducto">Nuevo producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label" for="pNombre">Nombre</label><input class="form-control" id="pNombre" required></div>
        <div class="row">
          <div class="col-6 mb-3"><label class="form-label" for="pCodigo">Código</label><input class="form-control" id="pCodigo" required></div>
          <div class="col-6 mb-3"><label class="form-label" for="pCategoria">Categoría</label><input class="form-control" id="pCategoria" required></div>
          <div class="col-6 mb-3"><label class="form-label" for="pPrecio">Precio ($)</label><input type="number" min="0" step="0.01" class="form-control" id="pPrecio" required></div>
          <div class="col-6 mb-3"><label class="form-label" for="pStock">Cantidad disponible</label><input type="number" min="0" step="1" class="form-control" id="pStock" required></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-principal">Guardar</button></div>
    </form></div>
  </div>
 
  <!-- Ventana: proveedor -->
  <div class="modal fade" id="modalProveedor" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><form class="modal-content" id="formProveedor">
      <div class="modal-header"><h5 class="modal-title" id="tituloProveedor">Nuevo proveedor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label" for="vNombre">Nombre</label><input class="form-control" id="vNombre" required></div>
        <div class="mb-3"><label class="form-label" for="vContacto">Contacto</label><input class="form-control" id="vContacto" required></div>
        <div class="mb-3"><label class="form-label" for="vTelefono">Teléfono</label><input type="tel" class="form-control" id="vTelefono" required></div>
        <div class="mb-3"><label class="form-label" for="vDireccion">Dirección</label><input class="form-control" id="vDireccion" required></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-principal">Guardar</button></div>
    </form></div>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Si no entró un administrador, vuelve al inicio de sesión
    if (sessionStorage.getItem("rol") !== "ADMINISTRADOR" || !sessionStorage.getItem("token")) {
      window.location.href = "InicioDeSesion.html";
    }
    document.getElementById("nombreUsuario").textContent = sessionStorage.getItem("nombre") || "Administrador";
    document.getElementById("btnSalir").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "InicioDeSesion.html";
    });
 
    const STOCK_BAJO = 5;   // desde esta cantidad hacia abajo se avisa "stock bajo"
    // Los datos se guardan en la base de datos a través del servidor (/api/productos y /api/proveedores)
    let productos = [];
    let proveedores = [];
    let editando = null;    // posición del elemento que se está editando (null = nuevo)
 
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const modalProducto = new bootstrap.Modal($("modalProducto"));
    const modalProveedor = new bootstrap.Modal($("modalProveedor"));

    // Hace el pedido al servidor mandando el token de la sesión. Si algo falla, lanza un Error con el mensaje.
    async function api(url, metodo = "GET", datos = null) {
      const opciones = { method: metodo, headers: { "X-Token": sessionStorage.getItem("token") || "" } };
      if (datos) {
        opciones.headers["Content-Type"] = "application/x-www-form-urlencoded";
        opciones.body = new URLSearchParams(datos).toString();
      }
      let res;
      try {
        res = await fetch(url, opciones);
      } catch (err) {
        throw new Error("No se pudo conectar con el servidor.");
      }
      const texto = await res.text();
      if (res.status === 401) {            // sesión vencida (por ejemplo, se reinició el servidor)
        sessionStorage.clear();
        window.location.href = "InicioDeSesion.html";
      }
      if (!res.ok) throw new Error(texto);
      return texto;
    }

    async function cargarProductos() {
      try { productos = JSON.parse(await api("/api/productos")); } catch (err) { alert(err.message); }
      dibujarProductos();
    }
    async function cargarProveedores() {
      try { proveedores = JSON.parse(await api("/api/proveedores")); } catch (err) { alert(err.message); }
      dibujarProveedores();
    }
 
    // Cambio de sección desde el menú
    document.querySelectorAll("#menu [data-seccion]").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("main > section").forEach((s) => s.classList.add("d-none"));
        $(b.dataset.seccion).classList.remove("d-none");
        document.querySelectorAll("#menu .dropdown-item").forEach((i) => i.classList.remove("active"));
        b.classList.add("active");
      });
    });
 
    function filaVacia(columnas, texto) {
      return `<tr><td colspan="${columnas}" class="text-center text-muted py-4">${texto}</td></tr>`;
    }
 
    function botonesEdicion(i, tipo) {
      return `<button class="btn btn-sm btn-outline-secondary me-1" onclick="editar${tipo}(${i})">Editar</button>
              <button class="btn btn-sm btn-outline-danger" onclick="eliminar${tipo}(${i})">Eliminar</button>`;
    }
 
    function dibujarProductos() {
      const q = $("filtro").value.trim().toLowerCase();
      const filas = productos.map((p, i) => ({ p, i })).filter(({ p }) =>
        [p.nombre, p.codigo, p.categoria].some((v) => v.toLowerCase().includes(q)));
      $("tablaProductos").innerHTML = filas.length ? filas.map(({ p, i }) => {
        const clase = p.stock === 0 ? "text-danger fw-bold" : p.stock <= STOCK_BAJO ? "text-warning fw-bold" : "";
        return `<tr><td>${esc(p.nombre)}</td><td>${esc(p.codigo)}</td><td>${esc(p.categoria)}</td>
                <td class="${clase}">${p.stock}</td><td>$${p.precio.toFixed(2)}</td><td>${celdaDoc(p.id)}</td><td>${botonesEdicion(i, "Producto")}</td></tr>`;
      }).join("") : filaVacia(7, "No hay productos para mostrar. Tocá + Nuevo producto para cargar el primero.");
    }
 
    function dibujarProveedores() {
      $("tablaProveedores").innerHTML = proveedores.length ? proveedores.map((v, i) =>
        `<tr><td>${esc(v.nombre)}</td><td>${esc(v.contacto)}</td><td>${esc(v.telefono)}</td>
         <td>${esc(v.direccion)}</td><td>${botonesEdicion(i, "Proveedor")}</td></tr>`).join("")
        : filaVacia(5, "Todavía no cargaste proveedores. Tocá + Nuevo proveedor.");
    }
 
    $("filtro").addEventListener("input", dibujarProductos);
 
    // ----- Productos -----
    $("btnNuevoProducto").addEventListener("click", () => {
      editando = null;
      $("formProducto").reset();
      $("tituloProducto").textContent = "Nuevo producto";
      modalProducto.show();
    });
    function editarProducto(i) {
      const p = productos[i];
      editando = i;
      $("pNombre").value = p.nombre; $("pCodigo").value = p.codigo; $("pCategoria").value = p.categoria;
      $("pPrecio").value = p.precio; $("pStock").value = p.stock;
      $("tituloProducto").textContent = "Editar producto";
      modalProducto.show();
    }
    async function eliminarProducto(i) {
      if (!confirm("¿Eliminar \"" + productos[i].nombre + "\"?")) return;
      try {
        await api("/api/productos/" + productos[i].id, "DELETE");
        await cargarProductos();
      } catch (err) { alert(err.message); }
    }
    $("formProducto").addEventListener("submit", async (e) => {
      e.preventDefault();
      const datos = {
        nombre: $("pNombre").value.trim(), codigo: $("pCodigo").value.trim(), categoria: $("pCategoria").value.trim(),
        precio: $("pPrecio").value, stock: $("pStock").value
      };
      try {
        if (editando === null) await api("/api/productos", "POST", datos);
        else await api("/api/productos/" + productos[editando].id, "PUT", datos);
        modalProducto.hide();
        await cargarProductos();
      } catch (err) { alert(err.message); }   // por ejemplo: "Ya existe un producto con ese código."
    });
 
    // ----- Proveedores -----
    $("btnNuevoProveedor").addEventListener("click", () => {
      editando = null;
      $("formProveedor").reset();
      $("tituloProveedor").textContent = "Nuevo proveedor";
      modalProveedor.show();
    });
    function editarProveedor(i) {
      const v = proveedores[i];
      editando = i;
      $("vNombre").value = v.nombre; $("vContacto").value = v.contacto;
      $("vTelefono").value = v.telefono; $("vDireccion").value = v.direccion;
      $("tituloProveedor").textContent = "Editar proveedor";
      modalProveedor.show();
    }
    async function eliminarProveedor(i) {
      if (!confirm("¿Eliminar a \"" + proveedores[i].nombre + "\"?")) return;
      try {
        await api("/api/proveedores/" + proveedores[i].id, "DELETE");
        await cargarProveedores();
      } catch (err) { alert(err.message); }
    }
    $("formProveedor").addEventListener("submit", async (e) => {
      e.preventDefault();
      const datos = {
        nombre: $("vNombre").value.trim(), contacto: $("vContacto").value.trim(),
        telefono: $("vTelefono").value.trim(), direccion: $("vDireccion").value.trim()
      };
      try {
        if (editando === null) await api("/api/proveedores", "POST", datos);
        else await api("/api/proveedores/" + proveedores[editando].id, "PUT", datos);
        modalProveedor.hide();
        await cargarProveedores();
      } catch (err) { alert(err.message); }
    });
 

    // ----- Documento (PDF o Excel) de cada producto -----
    const MAX_DOC_MB = 10;
    let documentos = new Map();   // id del producto -> "pdf" | "xlsx" | "xls"
    let productoDoc = null;       // producto al que se le está subiendo un documento

    async function cargarDocumentos() {
      try {
        const lista = JSON.parse(await api("/api/documentos"));
        documentos = new Map(lista.map((d) => [d.id, d.tipo]));
      } catch (err) { alert(err.message); }
      dibujarProductos();
    }
    // Sin documento: botón "+". Con documento: "Ver PDF" o "Descargar Excel", y "✕" para quitarlo
    function celdaDoc(id) {
      const tipo = documentos.get(id);
      if (!tipo) {
        return `<button class="btn btn-sm btn-principal" title="Agregar PDF o Excel" onclick="agregarDocumento(${id})">+</button>`;
      }
      const etiqueta = tipo === "pdf" ? "Ver PDF" : "Descargar Excel";
      return `<button class="btn btn-sm btn-outline-secondary me-1" onclick="abrirDocumento(${id})">${etiqueta}</button>
              <button class="btn btn-sm btn-outline-danger" title="Quitar documento" onclick="eliminarDocumento(${id})">✕</button>`;
    }
    function agregarDocumento(id) {
      productoDoc = id;
      $("archivoDoc").value = "";
      $("archivoDoc").click();
    }
    $("archivoDoc").addEventListener("change", async () => {
      const archivo = $("archivoDoc").files[0];
      if (!archivo || productoDoc === null) return;
      if (!/\.(pdf|xlsx|xls)$/i.test(archivo.name)) { alert("Solo se aceptan archivos PDF o Excel (.pdf, .xlsx, .xls)."); return; }
      if (archivo.size > MAX_DOC_MB * 1024 * 1024) { alert("El archivo supera los " + MAX_DOC_MB + " MB."); return; }
      try {
        const res = await fetch("/api/documentos/" + productoDoc, {
          method: "POST",
          headers: { "X-Token": sessionStorage.getItem("token") || "",
                     "X-Nombre": encodeURIComponent(archivo.name),
                     "Content-Type": "application/octet-stream" },
          body: archivo
        });
        const texto = await res.text();
        if (!res.ok) throw new Error(texto);
        await cargarDocumentos();
      } catch (err) { alert(err.message); }
    });
    // El PDF se abre en una pestaña nueva; el Excel se descarga
    async function abrirDocumento(id) {
      const tipo = documentos.get(id);
      const ventana = tipo === "pdf" ? window.open("", "_blank") : null;
      try {
        const res = await fetch("/api/documentos/" + id, { headers: { "X-Token": sessionStorage.getItem("token") || "" } });
        if (!res.ok) throw new Error(await res.text());
        const url = URL.createObjectURL(await res.blob());
        if (ventana) {
          ventana.location = url;
        } else {
          const prod = productos.find((x) => x.id === id);
          const enlace = document.createElement("a");
          enlace.href = url;
          enlace.download = (prod ? prod.nombre : "producto-" + id).replace(/[\\\/:*?"<>|]/g, "_") + "." + tipo;
          enlace.click();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
        }
      } catch (err) {
        if (ventana) ventana.close();
        alert(err.message);
      }
    }
    async function eliminarDocumento(id) {
      const prod = productos.find((x) => x.id === id);
      if (!confirm("¿Quitar el documento de \"" + (prod ? prod.nombre : "este producto") + "\"?")) return;
      try {
        await api("/api/documentos/" + id, "DELETE");
        await cargarDocumentos();
      } catch (err) { alert(err.message); }
    }

    cargarProductos();
    cargarProveedores();
    cargarDocumentos();
  </script>
</body>
</html>
