<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pañalera y Perfumería - Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
      <div class="card-body p-4">
        <h4 class="text-center mb-1">Pañalera y Perfumería</h4>
        <p class="text-center text-muted mb-4">Iniciar sesión</p>

        <div id="error" class="alert alert-danger d-none" role="alert"></div>

        <form id="formLogin">
          <div class="mb-3">
            <label for="email" class="form-label">Mail</label>
            <input type="email" class="form-control" id="email"
                   placeholder="nombre@ejemplo.com" required autofocus>
          </div>
          <div class="mb-3">
            <label for="clave" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="clave" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <p class="text-center mt-3 mb-0"><a href="registro.html">Crear usuario</a></p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("formLogin");
    const error = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.classList.add("d-none");

      const email = document.getElementById("email").value;
      const clave = document.getElementById("clave").value;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "email=" + encodeURIComponent(email)
              + "&clave=" + encodeURIComponent(clave)
        });

        if (!res.ok) {
          error.textContent = await res.text();
          error.classList.remove("d-none");
          return;
        }

        // El servidor devuelve el rol según el mail
        const usuario = await res.json();
        sessionStorage.setItem("nombre", usuario.nombre);
        sessionStorage.setItem("rol", usuario.rol);

        if (usuario.rol === "ADMINISTRADOR") {
          window.location.href = "admin.html";
        } else {
          window.location.href = "cliente.html";
        }

      } catch (err) {
        error.textContent = "No se pudo conectar con el servidor.";
        error.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
