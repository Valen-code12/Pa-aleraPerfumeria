<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La placita - Iniciar sesión</title>
  <link rel="icon" type="image/jpeg" href="imagenes/panaleraIcono.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  .logo-esquina {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 90px;
    height: auto;
    border-radius: 8px;
  }
  @media (max-width: 576px) {
    .logo-esquina { width: 60px; }
  }
  </style>
</head>
<body class="bg-light">
  <a href="InicioDeSesion.html">
    <img src="imagenes/panaleraIcono.jpg" alt="La Placita - Pañalera" class="logo-esquina">
  </a>
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
      <div class="card-body p-4">
        <h4 class="text-center mb-1">Pañalera y Perfumería - La placita</h4>
        <p class="text-center text-muted mb-4">Iniciar sesión</p>

        <div id="aviso" class="alert d-none" role="alert"></div>

        <!-- Paso 1: mail y contraseña -->
        <form id="formLogin">
          <div class="mb-3">
            <label for="email" class="form-label">Mail</label>
            <input type="email" class="form-control" id="email"
                   placeholder="nombre@ejemplo.com" required autofocus>
          </div>
          <div class="mb-3">
            <label for="clave" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="clave" required>
            <div class="form-text text-end">
              <a href="RecuperarClave.html">¿Olvidaste tu contraseña?</a>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <!-- Paso 2: código enviado al mail -->
        <form id="formCodigo" class="d-none">
          <p class="text-muted">
            Enviamos un código de 6 dígitos a <strong id="mailDestino"></strong>.
          </p>
          <div class="mb-3">
            <label for="codigo" class="form-label">Código de verificación</label>
            <input type="text" class="form-control text-center fs-4" id="codigo"
                   inputmode="numeric" maxlength="6"
                   autocomplete="one-time-code" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2">Verificar</button>
          <div class="d-flex justify-content-between">
            <button type="button" id="btnReenviar" class="btn btn-link p-0" disabled>Reenviar código</button>
            <button type="button" id="btnVolver" class="btn btn-link p-0">Volver</button>
          </div>
        </form>

        <p class="text-center mt-3 mb-0" id="pie"><a href="Registro.html">Crear usuario</a></p>
      </div>
    </div>
  </div>

  <script>
    const formLogin = document.getElementById("formLogin");
    const formCodigo = document.getElementById("formCodigo");
    const aviso = document.getElementById("aviso");
    const btnReenviar = document.getElementById("btnReenviar");
    let credenciales = null;   // mail y contraseña del paso 1 (para reenviar el código)
    let temporizador = null;

    // Deja solo números (si pegan "123 456" queda "123456")
    document.getElementById("codigo").addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
    });

    // Si el navegador recarga la página al ir al mail, vuelve al paso del código
    const mailGuardado = sessionStorage.getItem("loginEmail");
    if (mailGuardado) {
      document.getElementById("mailDestino").textContent = mailGuardado;
      document.getElementById("email").value = mailGuardado;
      formLogin.classList.add("d-none");
      document.getElementById("pie").classList.add("d-none");
      formCodigo.classList.remove("d-none");
    }

    function mostrar(texto, tipo) {
      aviso.textContent = texto;
      aviso.className = "alert alert-" + tipo;
    }

    function ocultarAviso() {
      aviso.className = "alert d-none";
    }

    async function post(url, datos) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(datos).toString()
      });
      return { ok: res.ok, texto: await res.text() };
    }

    // Bloquea "Reenviar código" durante 60 segundos
    function iniciarEspera() {
      let segundos = 60;
      clearInterval(temporizador);
      btnReenviar.disabled = true;
      btnReenviar.textContent = "Reenviar código (" + segundos + ")";
      temporizador = setInterval(() => {
        segundos--;
        if (segundos <= 0) {
          clearInterval(temporizador);
          btnReenviar.disabled = false;
          btnReenviar.textContent = "Reenviar código";
        } else {
          btnReenviar.textContent = "Reenviar código (" + segundos + ")";
        }
      }, 1000);
    }

    // Paso 1 -> pide el código
    async function pedirCodigo() {
      try {
        const r = await post("/login", credenciales);
        if (!r.ok) {
          mostrar(r.texto, "danger");
          return false;
        }
        return true;
      } catch (err) {
        mostrar("No se pudo conectar con el servidor.", "danger");
        return false;
      }
    }

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      ocultarAviso();

      credenciales = {
        email: document.getElementById("email").value.trim(),
        clave: document.getElementById("clave").value
      };

      if (await pedirCodigo()) {
        sessionStorage.setItem("loginEmail", credenciales.email);
        document.getElementById("mailDestino").textContent = credenciales.email;
        formLogin.classList.add("d-none");
        document.getElementById("pie").classList.add("d-none");
        formCodigo.classList.remove("d-none");
        document.getElementById("codigo").focus();
        mostrar("Código enviado. Revisá tu mail (también la carpeta de spam).", "info");
        iniciarEspera();
      }
    });

    btnReenviar.addEventListener("click", async () => {
      ocultarAviso();
      if (!credenciales) {
        mostrar("Tocá Volver y entrá de nuevo para pedir otro código.", "warning");
        return;
      }
      if (await pedirCodigo()) {
        mostrar("Te enviamos un código nuevo.", "info");
        iniciarEspera();
      }
    });

    document.getElementById("btnVolver").addEventListener("click", () => {
      sessionStorage.removeItem("loginEmail");
      clearInterval(temporizador);
      ocultarAviso();
      credenciales = null;
      document.getElementById("codigo").value = "";
      document.getElementById("clave").value = "";
      formCodigo.classList.add("d-none");
      formLogin.classList.remove("d-none");
      document.getElementById("pie").classList.remove("d-none");
    });

    // Paso 2 -> confirma el código
    formCodigo.addEventListener("submit", async (e) => {
      e.preventDefault();
      ocultarAviso();

      try {
        const r = await post("/login/verificar", {
          email: sessionStorage.getItem("loginEmail") || credenciales.email,
          codigo: document.getElementById("codigo").value.trim()
        });

        if (!r.ok) {
          mostrar(r.texto, "danger");
          return;
        }

        // El servidor devuelve el rol según el mail
        const usuario = JSON.parse(r.texto);
        sessionStorage.removeItem("loginEmail");
        sessionStorage.setItem("nombre", usuario.nombre);
        sessionStorage.setItem("rol", usuario.rol);

        // La página la decide el servidor (Administrador -> admin.html, Cliente -> cliente.html)
        window.location.href = usuario.pagina;

      } catch (err) {
        mostrar("No se pudo conectar con el servidor.", "danger");
      }
    });
  </script>
  <script>
  // Agrega un botón "ojo" a cada campo de contraseña
  document.querySelectorAll('input[type="password"]').forEach((campo) => {
    const grupo = document.createElement("div");
    grupo.className = "input-group";
    campo.parentNode.insertBefore(grupo, campo);
    grupo.appendChild(campo);

    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "btn btn-outline-secondary";
    boton.textContent = "👁️";
    boton.setAttribute("aria-label", "Mostrar contraseña");
    grupo.appendChild(boton);

    boton.addEventListener("click", () => {
      const oculto = campo.type === "password";
      campo.type = oculto ? "text" : "password";
      boton.textContent = oculto ? "🙈" : "👁️";
      boton.setAttribute("aria-label", oculto ? "Ocultar contraseña" : "Mostrar contraseña");
    });
  });
</script>
</body>
</html>
